<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>角色与语音设置</title>
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main class="settings-shell">
      <header class="hero">
        <div class="hero-icon">♪</div>
        <div>
          <p class="eyebrow">MINT PET · v0.1</p>
          <h1>动作与语音</h1>
          <p>逐个启用已经准备好的桌宠动作，并配置对应语音。</p>
        </div>
      </header>

      <div id="notice" class="notice" role="status" aria-live="polite"></div>

      <section class="card">
        <div class="section-title">
          <div>
            <span>当前角色</span>
            <small>小鸭薄荷 · 已接入电脑前待机与跑步动画</small>
          </div>
        </div>

        <div id="model-grid" class="model-grid"></div>
      </section>

      <section class="card voice-card">
        <div class="section-title">
          <div>
            <span>气泡语音</span>
            <small hidden>已知对白播放本地 MP3，新文字可用 Fish Audio</small>
          </div>
          <label class="switch">
            <input id="speech-enabled" type="checkbox" />
            <span></span>
          </label>
        </div>

        <div hidden>
          <label class="field">
            <span>API Key（仅新文字需要）</span>
            <input
              id="api-key"
              type="password"
              autocomplete="off"
              placeholder="输入 Fish Audio API Key"
            />
            <small id="api-key-status">尚未保存</small>
          </label>

          <div class="link-row">
            <button id="open-api-keys" class="text-button" type="button">
              获取 API Key ↗
            </button>
            <button id="clear-api-key" class="text-button danger" type="button">
              清除已保存 Key
            </button>
          </div>

          <label class="field">
            <span>声音模型 ID</span>
            <input id="voice-model-id" type="text" spellcheck="false" />
            <small>
              当前使用：
              <button id="open-voice-model" class="inline-link" type="button">
                1a667f…7c3 ↗
              </button>
            </small>
          </label>

          <label class="field">
            <span>试听文字</span>
            <textarea id="preview-text" maxlength="180">你好呀！今天也要开心哦。</textarea>
          </label>

          <button id="preview-speech" class="primary-button" type="button">
            <span class="button-icon">▶</span>
            <span>保存并试听</span>
          </button>
          <p id="voice-result" class="result-text" aria-live="polite"></p>
        </div>
      </section>

      <section class="card">
        <div class="section-title">
          <div>
            <span>动作开关</span>
            <small>关闭后不会出现在右键菜单；缺少资源的动作不可开启</small>
          </div>
        </div>

        <div id="action-switches" class="action-switch-list"></div>
      </section>

      <section class="card">
        <div class="section-title">
          <div>
            <span>一般待机</span>
            <small>固定一个动作，或按自定义间隔随机切换</small>
          </div>
        </div>

        <label class="field">
          <span>待机动作</span>
          <select id="idle-mode"></select>
        </label>

        <label class="field">
          <span>随机切换间隔（秒）</span>
          <input
            id="idle-interval"
            type="number"
            min="3"
            max="300"
            step="1"
            inputmode="numeric"
          />
          <small>仅“随机轮换”使用，可设置 3–300 秒。</small>
        </label>
      </section>

      <footer class="footer">
        <p>API Key 使用 Windows 安全存储加密，不会传给渲染页面。</p>
        <button id="save-settings" class="save-button" type="button">
          保存设置
        </button>
      </footer>
    </main>

    <script src="./characters.js"></script>
    <script src="./settings.js"></script>
  </body>
</html>
